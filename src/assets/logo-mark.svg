  <!-- Ruta arqueada sutil -->
  <path d="M14 44 Q 14 14, 44 14" stroke="#F5F2EB" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- "1" central -->
  <path d="M27 20 L33.5 17.5 L33.5 47 L28 47 L28 25 L24 26.5 L24 22 Z" fill="#F5F2EB"/>
